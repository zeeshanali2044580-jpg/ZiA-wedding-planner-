services:
  setup:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    command: npm install
    restart: "no"

  customer:
    image: node:22
    working_dir: /app
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    command: npm --workspace apps/customer run dev
    environment:
      - CHOKIDAR_USE_POLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    restart: unless-stopped

  artifacts:
    image: nginx:alpine
    volumes:
      - /tmp/zia-release:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped

  admin:
    image: node:22
    working_dir: /app
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    ports:
      - "8000:5174"
    command: npm --workspace apps/admin run dev
    environment:
      - CHOKIDAR_USE_POLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    restart: unless-stopped
